seed: 0
data:
  split: train
  img_size: 1024
  hflip: true
  crop_scale:
  - 0.75
  - 1.0
  num_workers: 4
model:
  adapter: bottleneck
  adapter_ratio: 0.25
  lora_rank: 8
  n_prompt_tokens: 4
  sam_weights: checkpoints/mobile_sam/mobile_sam.pt
augment:
  corruption_prob: 0.5
  corruptions: seen
  severities:
  - 1
  - 2
  - 3
  - 4
  - 5
consistency:
  weight: 0.0
  type: mse
  stopgrad_clean: true
train:
  epochs: 30
  batch_size: 2
  grad_accum: 4
  lr: 0.0002
  weight_decay: 0.0001
  warmup_steps: 100
  min_lr: 1.0e-06
  amp: fp16
  grad_checkpointing: true
  grad_clip: 1.0
  time_budget_hours: null
  log_every: 25
  save_every_minutes: 15
run_name: ours_aug
